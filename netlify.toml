[[redirects]]
  from = "http://olcorptech.ca/*"
  to = "https://olcorptech.ca/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.olcorptech.ca/*"
  to = "https://olcorptech.ca/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.olcorptech.ca/*"
  to = "https://olcorptech.ca/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
